# Builds the production output in CI so the server never needs the toolchain.
#
# The server-side one-click upgrade still exists as a fallback; this workflow is the
# path that makes upgrades pull + restart only. Artifact size matters: Next's incremental
# cache is excluded, which keeps it around 900 MB instead of 8 GB.
name: build-artifact

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The project pins yarn 4 via `packageManager`; setup-node's yarn cache step runs
      # whatever yarn is on PATH, so corepack has to be enabled first (yarn 1.22.22 is
      # preinstalled on the runner and refuses to run this repository).
      - name: Enable corepack (yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install
        run: yarn install --immutable || yarn install

      # Tests run BEFORE the build on purpose: a green artifact with a failing suite is the
      # failure mode this gate exists to prevent, and the auto-deploy gate only accepts a SHA
      # whose workflow actually ran tests (see scripts/auto-deploy/ci-gate.mjs). Type-check
      # and the unit suite are the fast pair; the browser suite needs a running server and
      # stays out of CI.
      # `yarn generate` must run before type-checking: `.mercato/generated/**` is gitignored,
      # so a fresh checkout has no generated route shards or entity types and `tsc` fails on
      # imports that only exist after generation. The first pushed run proved it (TS2307 on
      # backend-route-shards.generated).
      - name: Generate registries
        run: yarn generate

      - name: Type check
        run: yarn typecheck

      - name: Unit tests
        run: yarn test --silent

      - name: Build (applies managed patches)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: yarn build

      - name: Report build size
        run: |
          du -sh .mercato/next || true
          du -sh .mercato/next/cache || true

      - name: Drop build cache before upload
        run: rm -rf .mercato/next/cache

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: .mercato/next
          retention-days: 7
          compression-level: 0
