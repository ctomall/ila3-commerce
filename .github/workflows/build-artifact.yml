# Builds the production release package in CI so the server never needs the toolchain.
#
# The artifact is a *complete runtime package*, not just `.mercato/next`:
#   release.tar.gz          tracked runtime sources + .mercato/next + .mercato/generated
#   release-manifest.json   repo/run/commit/platform + per-file sha256 + archive sha256
# Both files are uploaded as ONE artifact, so the GitHub artifact digest covers the
# manifest too. scripts/auto-deploy/artifact.mjs re-hashes the download, compares it
# with that digest, then extracts and verifies every file before installing.
#
# On the production host the installer runs `yarn install --immutable` only — it never
# runs `next build`. `deploy.mjs --build-locally` remains the explicit CI-down fallback.
name: build-artifact

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The project pins yarn 4 via `packageManager`; setup-node's yarn cache step runs
      # whatever yarn is on PATH, so corepack has to be enabled first (yarn 1.22.22 is
      # preinstalled on the runner and refuses to run this repository).
      - name: Enable corepack (yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn

      - name: Install
        run: yarn install --immutable || yarn install

      # Tests run BEFORE the build on purpose: a green artifact with a failing suite is the
      # failure mode this gate exists to prevent, and the auto-deploy gate only accepts a SHA
      # whose workflow actually ran tests (see scripts/auto-deploy/ci-gate.mjs). Type-check
      # and the unit suite are the fast pair; the browser suite needs a running server and
      # stays out of CI.
      # `yarn generate` must run before type-checking: `.mercato/generated/**` is gitignored,
      # so a fresh checkout has no generated route shards or entity types and `tsc` fails on
      # imports that only exist after generation. The first pushed run proved it (TS2307 on
      # backend-route-shards.generated).
      - name: Generate registries
        run: yarn generate

      - name: Type check
        run: yarn typecheck

      - name: Unit tests
        run: yarn test --silent

      - name: Build (applies managed patches)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: yarn build

      # The incremental build cache is not needed to run the app and is the single
      # largest directory; dropping it keeps the uploaded artifact to roughly 700 MB.
      - name: Drop build cache before packaging
        run: rm -rf .mercato/next/cache

      # package-release.mjs is the same code path used by the local drills, so CI and
      # the server cannot drift on what a release package is.
      - name: Package release artifact
        run: |
          node scripts/auto-deploy/package-release.mjs \
            --source . \
            --out dist \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --node-major 24 \
            --platform linux \
            --arch x64 \
            --checks typecheck,unit,build \
            --json

      - name: Verify package contents
        run: |
          set -euo pipefail
          test -f dist/release.tar.gz
          test -f dist/release-manifest.json
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --argjson run "$GITHUB_RUN_ID" \
            '.schema == 1 and .commit == $sha and .repository == $repo and .workflowRunId == $run and .database.migrationRequired == false' \
            dist/release-manifest.json
          # The package must not carry secrets, database dumps or node_modules.
          # Root node_modules is forbidden, but .mercato/next/node_modules contains the
          # relative symlinks Next creates for externalized packages and must stay.
          if tar -tzf dist/release.tar.gz | grep -E '(^|/)\.env($|\.)|^node_modules/|\.sql($|\.)|\.dump($|\.)'; then
            echo "forbidden file in release package" >&2
            exit 1
          fi
          ls -lh dist

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mercato-release-${{ github.sha }}
          path: dist/
          retention-days: 7
          # release.tar.gz is already gzip-compressed; zipping it again only wastes CPU.
          compression-level: 0
          if-no-files-found: error
