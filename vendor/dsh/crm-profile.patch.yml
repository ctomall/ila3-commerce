# CRM tool bridge overlay for the DSH runtime (C1).
#
# Applied as `dsh --profile sdk-minimal --patch <this file>`. It inserts only the
# stdio CRM MCP server; the server itself is `scripts/dsh-crm-mcp.mjs` and every
# tool call goes back through the CRM bridge with the run's signed token.
#
# All three values are supplied by the chat route in the DSH child environment;
# no token is written into this file, the profile, or the repository.
- insert:
    - id: mcp-crm
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: crm
        transport: stdio
        command: node
        args: !!js '[process.env.OM_DSH_MCP_SCRIPT]'
        env:
          OM_DSH_BRIDGE_URL: !!js process.env.OM_DSH_BRIDGE_URL
          OM_DSH_TOOL_TOKEN: !!js process.env.OM_DSH_TOOL_TOKEN

# The CRM assistant must not receive host-level capabilities. `sdk-minimal`
# otherwise mounts generic filesystem, working-directory and persistent-shell
# tools plus the reverse-engineering MCP server; any of them would let a model
# read another employee's DSH_HOME or the host directly. Identity and data
# access stay behind the signed CRM tool bridge, so these rows are disabled.
- id: tool-fs
  # The row is nested in the SDK layer, so disabling by id does not reach it;
  # replace its config with every file operation off instead.
  config:
    read: false
    readImage: false
    write: false
    edit: false
    applyPatch: false

- id: tool-working-directory
  disabled: true

- id: persistent-bash
  disabled: true

- id: persistent-pwsh
  disabled: true

- id: rea-mcp
  disabled: true
